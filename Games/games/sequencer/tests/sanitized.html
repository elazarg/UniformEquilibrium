<!doctype html><html><head><meta charset="utf-8"><title>running</title></head>
<body><pre id="out">running…</pre>
<iframe id="frame" src="../index.html" width="1280" height="860"></iframe>
<script type="module">
const out = document.getElementById("out");
const log = [];
const say = (ok, t) => log.push(`${ok ? "ok  " : "FAIL"} ${t}`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
document.getElementById("frame").addEventListener("load", async () => {
  const w = document.getElementById("frame").contentWindow;
  const d = w.document;
  w.addEventListener("error", (e) => say(false, `uncaught: ${e.message}`));
  try {
    await wait(900);
    d.getElementById("targets-open").click();
    await wait(200);
    const picker = d.getElementById("targets").textContent;
    say(!/e\+9|1000000000|\d\.\d/.test(picker), `no sanitized sentinels leak into the picker: ${picker.slice(0, 80)}`);
    const cards = [...d.querySelectorAll("#candidate-list .card")];
    say(cards.length === 3, `three rooms offered: ${cards.length}`);
    say(cards[0].classList.contains("wanted"), "the only really-scored room ranks first");
    const pipsFirst = cards[0].querySelectorAll(".pip.on").length;
    const pipsRest = cards.slice(1).map((c) => c.querySelectorAll(".pip.on").length);
    say(pipsFirst > 0 && pipsRest.every((p) => p === 0),
        `heat only where a floor was actually recorded: ${pipsFirst} vs ${pipsRest}`);
    say(cards.slice(1).every((c) => c.textContent.includes("new")),
        "rooms with no recorded floor are shown as new, not as hardest");
    d.getElementById("targets").close();
    // the server answers with null (nan sanitized): it must never read as settled
    const input = d.getElementById("cell-value");
    input.value = "0.5";
    input.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(1700);
    say(!d.getElementById("lock").open, "a null reading is not a settled room");
    say(d.getElementById("status").textContent.includes("could not read"),
        `status: ${d.getElementById("status").textContent}`);
    const stored = w.localStorage.getItem("sequencer.progress.v1");
    say(!stored || JSON.parse(stored).grooves === 0, "nothing recorded");
  } catch (e) { say(false, `threw: ${e && e.stack ? e.stack : e}`); }
  const failed = log.some((l) => l.startsWith("FAIL"));
  document.title = failed ? "FAIL" : "PASS";
  out.textContent = log.join("\n") + `\n\n${failed ? "FAIL" : "PASS"}`;
});
</script></body></html>
