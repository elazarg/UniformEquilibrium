name: Agent checkout artifact

on:
  push:
    branches:
      - agent/complete-akrs2022

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/upload-artifact@v4
        with:
          name: uniform-equilibrium-checkout
          include-hidden-files: true
          retention-days: 1
          path: |
            .
            !.git/**
