name: Finalize PR 45 ratchet fix

on:
  push:
    branches:
      - agent/complete-solan-vieille-2001

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply verified cleanup and remove staging
        shell: bash
        run: |
          echo "ad79b39948678e9187042fa83d433de910253d500256d9e195a29dcfb8e54528  .pr45-ratchet-fix.patch" | sha256sum --check -
          git apply --check .pr45-ratchet-fix.patch
          git apply .pr45-ratchet-fix.patch
          rm .pr45-ratchet-fix.patch .github/workflows/pr45-ratchet-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove redundant reward-bound parameter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
