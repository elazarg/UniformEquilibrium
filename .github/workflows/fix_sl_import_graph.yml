name: Fix SL-PRESCRIBED import reachability

on:
  push:
    branches: [agent/eliminate-sl-prescribed]
    paths:
      - '.github/workflows/fix_sl_import_graph.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore compatibility import reachability
        shell: bash
        run: |
          set -euo pipefail
          file=UniformEquilibrium/Diagnostics/Quitting/CounterexampleRegime/All.lean
          sed -i \
            's/StoppingLaw\.ThreeWayLocalization/StoppingLaw.FourWayLocalization/' \
            "$file"
          rm .github/workflows/fix_sl_import_graph.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Restore stopping-law compatibility import'
          git push origin HEAD:agent/eliminate-sl-prescribed
