name: Apply Fink 1964 patch

on:
  push:
    branches:
      - agent/promote-fink1964
    paths:
      - .tmp/apply_fink1964_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-fink1964
          fetch-depth: 0
          submodules: recursive
      - run: python3 .tmp/apply_fink1964_patch.py
      - run: |
          if git diff --quiet -- Literature/Fink1964.lean; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Literature/Fink1964.lean
          git commit -m "Repair Fink audit elaboration"
          git push origin HEAD:agent/promote-fink1964
