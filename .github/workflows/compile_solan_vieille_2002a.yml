name: Compile Solan and Vieille 2002a

on:
  pull_request:
  push:
    branches:
      - agent/promote-solan-vieille-2002a
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-solan-vieille-2002a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Reconstruct staged source
        run: |
          cat .tmp/SolanAndVieille2002a.part0* > /tmp/source.b64
          base64 --decode /tmp/source.b64 | gzip --decompress > Literature/SolanAndVieille2002a.lean
          printf '%s  %s\n' "$(cat .tmp/SolanAndVieille2002a.version)" \
            Literature/SolanAndVieille2002a.lean | sha256sum --check
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile promoted paper
        run: lake env lean Literature/SolanAndVieille2002a.lean
      - name: Commit compiled source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Literature/SolanAndVieille2002a.lean
          if ! git diff --cached --quiet; then
            git commit -m 'Update Solan and Vieille paper formalization'
            git push
          fi
