name: Compile Solan and Vieille 2002a

on:
  pull_request:
  push:
    branches:
      - agent/promote-solan-vieille-2002a
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-solan-vieille-2002a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - run: lake env lean Literature/SolanAndVieille2002a.lean
