name: Compact Nash master stage 5b

on:
  push:
    branches: [agent/promote-sorin1986]
    paths:
      - .github/workflows/compact_nash_master_stage5b.yml
      - Literature/Sorin1986/CompactNashMaster5a.ok
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-nash-master-stage5b
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: agent/promote-sorin1986
          fetch-depth: 0
      - name: Inspect state
        id: state
        run: |
          if test -f Literature/Sorin1986/CompactNashMaster5.ok || test -f Literature/Sorin1986/CompactNashMaster5b.ok; then echo done=yes >> "$GITHUB_OUTPUT"; else echo done=no >> "$GITHUB_OUTPUT"; fi
      - name: Wait for stage 5a
        if: steps.state.outputs.done == 'no'
        run: |
          for attempt in $(seq 1 120); do
            git fetch origin agent/promote-sorin1986
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster.lean 2>/dev/null || true
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster5a.ok 2>/dev/null || true
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster5.ok 2>/dev/null || true
            test -f Literature/Sorin1986/CompactNashMaster5.ok && exit 0
            test -f Literature/Sorin1986/CompactNashMaster5a.ok && exit 0
            sleep 10
          done
          exit 1
      - uses: leanprover/lean-action@v1
        if: steps.state.outputs.done == 'no'
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Append compact open-cover argument
        if: steps.state.outputs.done == 'no'
        run: |
          if test -f Literature/Sorin1986/CompactNashMaster5.ok; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Literature/Sorin1986/CompactNashMaster.lean'); s=p.read_text()
          end=s.rindex('\nend CompactNash')
          addition=r'''

          /-- Compactness upgrades finite satisfiability of Nash inequalities
          to simultaneous satisfiability of all unilateral inequalities. -/
          theorem exists_all_nash_inequalities (G : CompactContinuousGame) :
              ∃ profile : ∀ i, G.Strategy i,
                ∀ d : Deviation G,
                  G.payoff (Function.update profile d.1 d.2) d.1 ≤
                    G.payoff profile d.1 := by
            classical
            by_contra hnone
            push_neg at hnone
            have hcover : (Set.univ : Set (∀ i, G.Strategy i)) ⊆
                ⋃ d : Deviation G, profitableSet G d := by
              intro profile _
              obtain ⟨d, hd⟩ := hnone profile
              exact Set.mem_iUnion.2 ⟨d, hd⟩
            obtain ⟨F, hF⟩ :=
              (isCompact_univ : IsCompact
                (Set.univ : Set (∀ i, G.Strategy i))).elim_finite_subcover
                (profitableSet G) (isOpen_profitableSet G) hcover
            obtain ⟨profile, hprofile⟩ := exists_satisfies_finset G F
            have hcovered := hF (Set.mem_univ profile)
            rcases Set.mem_iUnion.1 hcovered with ⟨d, hcovered⟩
            rcases Set.mem_iUnion.1 hcovered with ⟨hdF, hprofitable⟩
            exact (not_lt_of_ge (hprofile d hdF)) hprofitable
          '''
          p.write_text(s[:end]+addition+s[end:])
          PY
          set -o pipefail
          lake env lean Literature/Sorin1986/CompactNashMaster.lean 2>&1 | tee Literature/Sorin1986/CompactNashMaster5b.log
          printf 'success\n' > Literature/Sorin1986/CompactNashMaster5b.ok
      - name: Commit compactness step
        if: steps.state.outputs.done == 'no'
        run: |
          if test -f Literature/Sorin1986/CompactNashMaster5.ok; then exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Literature/Sorin1986/CompactNashMaster.lean Literature/Sorin1986/CompactNashMaster5b.log Literature/Sorin1986/CompactNashMaster5b.ok
          git commit -m 'Upgrade finite Nash constraints by compactness'
          git pull --rebase origin agent/promote-sorin1986
          git push origin HEAD:agent/promote-sorin1986
