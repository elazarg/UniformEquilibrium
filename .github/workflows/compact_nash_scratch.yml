name: Compact Nash scratch

on:
  push:
    branches: [agent/promote-sorin1986]
    paths:
      - Literature/Sorin1986/CompactNashScratch.lean
      - .github/workflows/compact_nash_scratch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-nash-scratch
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - run: lake build Literature.Sorin1986.CompactNashScratch
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-nash-scratch-${{ github.run_id }}
          path: Literature/Sorin1986/CompactNashScratch.lean
