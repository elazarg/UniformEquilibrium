name: Apply complete Fink 1964 proof patch

on:
  push:
    branches:
      - agent/promote-fink1964
    paths:
      - .tmp/complete_fink1964.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-fink1964
          fetch-depth: 0
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - run: python3 .tmp/complete_fink1964.py
      - run: |
          lake build +UniformEquilibrium.ProofView.Concepts.Stochastic.Equilibrium.Discounted.FinkHeterogeneous +MathUE.Finset.SupNonexpansive
          lake env lean Literature/Fink1964.lean
      - run: |
          if git diff --quiet -- Literature/Fink1964.lean; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Literature/Fink1964.lean
          git commit -m "Complete analytic part of Fink 1964 audit"
          git push origin HEAD:agent/promote-fink1964
