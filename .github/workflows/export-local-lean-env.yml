name: Export local Lean environment

on:
  push:
    branches:
      - research/full-core-deadlock-bounded-complexity-barrier

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Package compatible environment
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/local-lean-environment"
          mkdir -p "$out"
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          toolchain_path="$(dirname "$(dirname "$(elan which lean)")")"
          tar --zstd -cf "$out/lake-cache.tar.zst" .lake
          tar --zstd -cf "$out/lean-toolchain.tar.zst" \
            -C "$(dirname "$toolchain_path")" "$(basename "$toolchain_path")"
          sha256sum "$out"/*.tar.zst > "$out/SHA256SUMS"
          cat > "$out/manifest.txt" <<EOF
          source_sha=$(git rev-parse HEAD)
          game_theory_sha=$(git -C GameTheory rev-parse HEAD)
          lean_toolchain=$toolchain
          toolchain_dir=$(basename "$toolchain_path")
          lake_manifest_sha256=$(sha256sum lake-manifest.json | cut -d' ' -f1)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-environment-${{ github.sha }}
          path: ${{ runner.temp }}/local-lean-environment
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
