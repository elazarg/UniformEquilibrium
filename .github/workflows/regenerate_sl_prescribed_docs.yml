name: Regenerate SL-PRESCRIBED documentation

on:
  push:
    branches: [agent/eliminate-sl-prescribed]
    paths:
      - '.github/workflows/regenerate_sl_prescribed_docs.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Update the formal frontier ledger
        run: python3 .agent/sl-prescribed/regenerate.py
      - name: Regenerate audit and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_axiom_audit.py
          python3 scripts/generate_docs.py
          rm -r .agent/sl-prescribed
          rm .github/workflows/regenerate_sl_prescribed_docs.yml
      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Regenerate three-way frontier documentation'
          git push origin HEAD:agent/eliminate-sl-prescribed
