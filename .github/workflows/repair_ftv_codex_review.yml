name: Repair FTV Codex review

on:
  push:
    branches: [agent/promote-ftv-1997]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-ftv-codex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-ftv-1997
          fetch-depth: 0
          submodules: recursive
      - name: Apply source fix
        run: |
          echo ' ' | base64 --decode > /tmp/fix_ftv.py
          python3 /tmp/fix_ftv.py
      - name: Commit source fix
        run: |
          if git diff --quiet -- Literature/FleschThuijsmanAndVrieze1997.lean; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Literature/FleschThuijsmanAndVrieze1997.lean
          git commit -m "Fix FTV audit review layout"
          git push origin HEAD:agent/promote-ftv-1997
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Build imported dependencies
        run: |
          lake build \
            UniformEquilibrium.Quitting.Classification.PlayerReindex \
            UniformEquilibrium.Quitting.Examples.FTV.CyclicAdmissibleCycle \
            UniformEquilibrium.Quitting.Paths.InfinitePathCompiler \
            UniformEquilibrium.Quitting.Root.ApproximateFirstBranch \
            UniformEquilibrium.Quitting.Stationary.FullRateStationaryVerifier \
            UniformEquilibrium.Quitting.Terminal.TargetTail.TerminalUniformPayoffSelection
      - name: Compile FTV audit
        run: lake env lean Literature/FleschThuijsmanAndVrieze1997.lean
