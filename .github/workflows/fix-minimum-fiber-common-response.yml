name: Fix minimum-fiber common response

on:
  push:
    branches:
      - gpt/fix-minimum-fiber-common-response
    paths:
      - ".github/workflows/fix-minimum-fiber-common-response.yml"

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/fix-minimum-fiber-common-response
          fetch-depth: 0
          submodules: recursive

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Apply exact elaboration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Research/Quitting/StoppingLawMinimumFiberCommonResponseCompiler.lean"
          )
          text = path.read_text()

          start = text.index(
              "  have hdebt :=\n"
              "    quittingTerminalSemanticDebt_stoppingLawMixture_"
              "chordGap_le_nearMinimum\n"
          )
          end = text.index("  have hbound :", start)
          new = (
              "  have hnear' : ∀ candidate ∈ "
              "quittingTerminalSemanticCarrier reward,\n"
              "      quittingTerminalSemanticDebtSum\n"
              "          (quittingTerminalSemanticPair reward\n"
              "            (Function.update (frontier.source rank) mover.1\n"
              "              (frontier.source rank mover.1))) ≤\n"
              "        quittingTerminalSemanticDebtSum candidate + epsilon := by\n"
              "    simpa only [Function.update_eq_self, sourcePair] using hnear\n"
              "  have hdebt :=\n"
              "    quittingTerminalSemanticDebt_stoppingLawMixture_"
              "chordGap_le_nearMinimum\n"
              "      reward (frontier.source rank) mover.1 observer\n"
              "        (frontier.source rank mover.1) "
              "(frontier.replacement mover rank)\n"
              "        (1 / 2 : ℝ) epsilon (by norm_num) (by norm_num) hnear'\n"
          )
          text = text[:start] + new + text[end:]

          start = text.index("    dsimp only at hdebt\n")
          end = text.index(
              "  rw [frontier.fullReplacementHalfCapChordGap_eq_debtChordGap",
              start,
          )
          new = (
              "    have hdebtUpper := hdebt.2\n"
              "    rw [Function.update_eq_self] at hdebtUpper\n"
              "    simp only [sourcePair, fullReplacementPair, "
              "fullReplacementProfile,\n"
              "      fullReplacementHalfProfile, "
              "quittingStoppingLawResetProfile] at hdebtUpper\n"
              "    nlinarith [hdebtUpper]\n"
          )
          text = text[:start] + new + text[end:]

          old = (
              "    simpa only [sourcePair] using\n"
              "      frontier.source_tendsto.comp "
              "endpoint.subseq_strictMono.tendsto_atTop\n"
          )
          new = (
              "    simpa only [Function.comp_def, sourcePair] using\n"
              "      frontier.source_tendsto.comp "
              "endpoint.subseq_strictMono.tendsto_atTop\n"
          )
          if old not in text:
              raise SystemExit("source tendsto block not found")
          text = text.replace(old, new, 1)

          old = "  simpa only [commonResponseError] using hsum.const_mul 2\n"
          new = (
              "  change Tendsto (fun rank ↦ 2 *\n"
              "    (frontier.fullReplacementHalfCapChordGap mover observer.1\n"
              "      (endpoint.subseq rank) + "
              "endpoint.commonResponseTolerance rank))\n"
              "    atTop (nhds 0)\n"
              "  convert hsum.const_mul 2 using 1 <;> ring\n"
          )
          if old not in text:
              raise SystemExit("common-response limit block not found")
          path.write_text(text.replace(old, new, 1))

          path = Path(
              "Research/Quitting/FinFourProducerAtlas/"
              "CanonicalPairEndpointSourceRegeneration.lean"
          )
          text = path.read_text()
          old = (
              "    simpa only [renewalEndpointLawPoint, "
              "renewalEndpointProfile] using\n"
              "      handoff.endpointPacket_endpoint_tendsto.comp\n"
              "        hsubsequence.tendsto_atTop\n"
          )
          new = (
              "    simpa only [Function.comp_def, renewalEndpointLawPoint,\n"
              "      renewalEndpointProfile] using\n"
              "      handoff.endpointPacket_endpoint_tendsto.comp\n"
              "        hsubsequence.tendsto_atTop\n"
          )
          if old not in text:
              raise SystemExit("endpoint tendsto block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Check focused Lean files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_trust.py
          lake env lean \
            Research/Quitting/StoppingLawMinimumFiberCommonResponseCompiler.lean
          lake env lean \
            Research/Quitting/FinFourProducerAtlas/CanonicalPairEndpointSourceRegeneration.lean

      - name: Commit checked fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Research/Quitting/StoppingLawMinimumFiberCommonResponseCompiler.lean \
            Research/Quitting/FinFourProducerAtlas/CanonicalPairEndpointSourceRegeneration.lean
          git commit -m "Fix common-response compiler elaboration"
          git push origin HEAD:gpt/fix-minimum-fiber-common-response
