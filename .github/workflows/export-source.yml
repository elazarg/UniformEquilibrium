name: Apply singleton-elimination patch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/eliminate-sl-singleton'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eliminate-sl-singleton
          submodules: recursive
          fetch-depth: 0
      - name: Apply verified patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/ue-singleton-elimination.patch.gz.b64 | gzip -d > /tmp/ue.patch
          git apply --check /tmp/ue.patch
          git apply /tmp/ue.patch
          rm .github/ue-singleton-elimination.patch.gz.b64
          rm .github/workflows/export-source.yml
          python scripts/generate_docs.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminate singleton stopping-law branch"
          git push origin HEAD:agent/eliminate-sl-singleton
