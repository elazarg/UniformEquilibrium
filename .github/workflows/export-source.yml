name: Export source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/upload-artifact@v4
        with:
          name: uniform-equilibrium-source
          path: |
            .
            !.git
            !**/.git
          include-hidden-files: true
