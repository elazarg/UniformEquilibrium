name: Compact Nash master stage 3b

on:
  push:
    branches: [agent/promote-sorin1986]
    paths:
      - .github/workflows/compact_nash_master_stage3b.yml
      - Literature/Sorin1986/CompactNashMaster3a.ok
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-nash-master-stage3b
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: agent/promote-sorin1986
          fetch-depth: 0
      - name: Inspect state
        id: state
        run: |
          if test -f Literature/Sorin1986/CompactNashMaster3b.ok; then echo done=yes >> "$GITHUB_OUTPUT"; else echo done=no >> "$GITHUB_OUTPUT"; fi
      - name: Wait for stage 3a
        if: steps.state.outputs.done == 'no'
        run: |
          for attempt in $(seq 1 90); do
            git fetch origin agent/promote-sorin1986
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster.lean 2>/dev/null || true
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster3a.ok 2>/dev/null || true
            test -f Literature/Sorin1986/CompactNashMaster3a.ok && exit 0
            sleep 10
          done
          exit 1
      - uses: leanprover/lean-action@v1
        if: steps.state.outputs.done == 'no'
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Append restricted game definitions
        if: steps.state.outputs.done == 'no'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Literature/Sorin1986/CompactNashMaster.lean')
          s=p.read_text(); end=s.rindex('\nend CompactNash')
          addition=r'''

          /-- Reindexing a dependent profile commutes with unilateral update. -/
          theorem piCongrLeft_update {P Q : Type*} [DecidableEq P]
              [DecidableEq Q] (S : Q → Type*) (e : P ≃ Q)
              (profile : ∀ i : P, S (e i)) (who : P) (strategy : S (e who)) :
              Equiv.piCongrLeft S e (Function.update profile who strategy) =
                Function.update (Equiv.piCongrLeft S e profile) (e who) strategy := by
            funext q
            obtain ⟨i, rfl⟩ := e.surjective q
            by_cases h : i = who
            · subst i
              simp [Equiv.piCongrLeft_apply_apply]
            · have he : e i ≠ e who := fun h' => h (e.injective h')
              simp [Equiv.piCongrLeft_apply_apply, Function.update_of_ne, h, he]

          /-- A unilateral deviation with its owner. -/
          abbrev Deviation (G : CompactContinuousGame) :=
            Σ who, G.Strategy who

          /-- Finite labels available to a reindexed player. -/
          abbrev RestrictedAction (G : CompactContinuousGame)
              {n : ℕ} (e : Fin n ≃ G.Player) (F : Finset (Deviation G))
              (j : Fin n) :=
            Option {d : F // d.1.1 = e j}

          /-- Decode a finite label as an original compact strategy. -/
          noncomputable def restrictedStrategy (G : CompactContinuousGame)
              {n : ℕ} (e : Fin n ≃ G.Player) (F : Finset (Deviation G))
              (j : Fin n) : RestrictedAction G e F j → G.Strategy (e j)
            | none => Classical.choice
                (inferInstance : Nonempty (G.Strategy (e j)))
            | some d =>
                cast (congrArg G.Strategy d.2) d.1.1.2

          /-- Finite game retaining a finite family of compact deviations and
          one default strategy for each player. -/
          noncomputable def restrictedGame (G : CompactContinuousGame)
              {n : ℕ} (e : Fin n ≃ G.Player) (F : Finset (Deviation G)) :
              FiniteStageGame := by
            classical
            let eS : (∀ j : Fin n, G.Strategy (e j)) ≃
                (∀ i, G.Strategy i) := Equiv.piCongrLeft G.Strategy e
            exact {
              Player := Fin n
              Action := RestrictedAction G e F
              payoff := fun actions observer =>
                G.payoff
                  (eS (fun j => restrictedStrategy G e F j (actions j)))
                  (e observer) }
          '''
          p.write_text(s[:end]+addition+s[end:])
          PY
          set -o pipefail
          lake env lean Literature/Sorin1986/CompactNashMaster.lean 2>&1 | tee Literature/Sorin1986/CompactNashMaster3b.log
          printf 'success\n' > Literature/Sorin1986/CompactNashMaster3b.ok
      - name: Commit restricted game
        if: steps.state.outputs.done == 'no'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Literature/Sorin1986/CompactNashMaster.lean Literature/Sorin1986/CompactNashMaster3b.log Literature/Sorin1986/CompactNashMaster3b.ok
          git commit -m 'Construct finite restricted compact game'
          git pull --rebase origin agent/promote-sorin1986
          git push origin HEAD:agent/promote-sorin1986
