name: Compact Nash stage 5

on:
  push:
    branches: [agent/promote-sorin1986]
    paths:
      - .github/workflows/compact_nash_stage5.yml
      - Literature/Sorin1986/CompactNashStage4.ok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: agent/promote-sorin1986
      - name: Require stage 4
        run: test -f Literature/Sorin1986/CompactNashStage4.ok
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Append compactness theorem
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Literature/Sorin1986/CompactNashScratch.lean')
          s = p.read_text()
          marker = '\nend CompactNash\n\nend Literature.Sorin1986\n'
          assert marker in s
          addition = r'''

          /-- Updating one coordinate to a fixed strategy is continuous in the
          remaining profile. -/
          theorem continuous_update_const (G : CompactContinuousGame)
              (who : G.Player) (strategy : G.Strategy who) :
              Continuous fun profile : (∀ i, G.Strategy i) =>
                Function.update profile who strategy := by
            apply continuous_pi
            intro i
            by_cases h : i = who
            · subst h
              simpa using (continuous_const :
                Continuous fun _ : (∀ i, G.Strategy i) => strategy)
            · simpa [Function.update_of_ne h] using
                (continuous_apply i :
                  Continuous fun profile : (∀ i, G.Strategy i) => profile i)

          /-- Profiles at which one listed deviation is strictly profitable. -/
          def profitableSet (G : CompactContinuousGame) (d : Deviation G) :
              Set (∀ i, G.Strategy i) :=
            {profile | G.payoff profile d.1 <
              G.payoff (Function.update profile d.1 d.2) d.1}

          theorem isOpen_profitableSet (G : CompactContinuousGame)
              (d : Deviation G) : IsOpen (profitableSet G d) := by
            exact isOpen_lt (G.payoffContinuous d.1)
              ((G.payoffContinuous d.1).comp
                (continuous_update_const G d.1 d.2))

          /-- Compactness turns finite satisfiability of the Nash inequalities
          into simultaneous satisfiability of all unilateral inequalities. -/
          theorem exists_all_nash_inequalities (G : CompactContinuousGame) :
              ∃ profile : ∀ i, G.Strategy i,
                ∀ d : Deviation G,
                  G.payoff (Function.update profile d.1 d.2) d.1 ≤
                    G.payoff profile d.1 := by
            classical
            by_contra hnone
            push_neg at hnone
            have hcover : (Set.univ : Set (∀ i, G.Strategy i)) ⊆
                ⋃ d : Deviation G, profitableSet G d := by
              intro profile _hprofile
              obtain ⟨d, hd⟩ := hnone profile
              exact Set.mem_iUnion.2 ⟨d, hd⟩
            obtain ⟨F, hF⟩ :=
              (isCompact_univ : IsCompact
                (Set.univ : Set (∀ i, G.Strategy i))).elim_finite_subcover
                (profitableSet G) (isOpen_profitableSet G) hcover
            obtain ⟨profile, hprofile⟩ := exists_satisfies_finset G F
            have hcovered := hF (Set.mem_univ profile)
            rcases Set.mem_iUnion.1 hcovered with ⟨d, hcovered⟩
            rcases Set.mem_iUnion.1 hcovered with ⟨hdF, hprofitable⟩
            exact (not_lt_of_ge (hprofile d hdF)) hprofitable

          /-- Every compact continuous game in this interface has a Nash
          equilibrium. -/
          theorem exists_isNash (G : CompactContinuousGame) :
              ∃ profile : ∀ i, G.Strategy i, G.IsNash profile := by
            obtain ⟨profile, hprofile⟩ := exists_all_nash_inequalities G
            refine ⟨profile, ?_⟩
            intro who deviation
            exact hprofile ⟨who, deviation⟩

          /-- The Nash-profile set is closed. -/
          theorem isClosed_isNash (G : CompactContinuousGame) :
              IsClosed {profile : (∀ i, G.Strategy i) | G.IsNash profile} := by
            rw [show {profile : (∀ i, G.Strategy i) | G.IsNash profile} =
                ⋂ who, ⋂ deviation,
                  {profile | G.payoff
                      (Function.update profile who deviation) who ≤
                    G.payoff profile who} by
              ext profile
              simp [CompactContinuousGame.IsNash]]
            exact isClosed_iInter fun who => isClosed_iInter fun deviation =>
              isClosed_le
                ((G.payoffContinuous who).comp
                  (continuous_update_const G who deviation))
                (G.payoffContinuous who)

          /-- General compact Nash existence and compactness of equilibrium
          payoffs. -/
          theorem compact_nash_existence (G : CompactContinuousGame) :
              G.equilibriumPayoffs.Nonempty ∧
                IsCompact G.equilibriumPayoffs := by
            have hexists := exists_isNash G
            constructor
            · obtain ⟨profile, hprofile⟩ := hexists
              exact ⟨G.payoff profile, ⟨profile, hprofile, rfl⟩⟩
            · have hprofiles :
                  IsCompact {profile : (∀ i, G.Strategy i) | G.IsNash profile} :=
                (isClosed_isNash G).isCompact
              have hpayoff : Continuous G.payoff :=
                continuous_pi G.payoffContinuous
              simpa [CompactContinuousGame.equilibriumPayoffs] using
                hprofiles.image_of_continuousOn hpayoff.continuousOn
          '''
          p.write_text(s.replace(marker, addition + marker))
          PY
      - name: Compile
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          lake build Literature.Sorin1986.CompactNashScratch 2>&1 | tee /tmp/compact-nash-stage5.log
      - name: Record result
        run: |
          cp /tmp/compact-nash-stage5.log Literature/Sorin1986/CompactNashStage5.log
          if [ "${{ steps.compile.outcome }}" = success ]; then
            printf 'success\n' > Literature/Sorin1986/CompactNashStage5.ok
          else
            rm -f Literature/Sorin1986/CompactNashStage5.ok
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Literature/Sorin1986/CompactNashScratch.lean \
            Literature/Sorin1986/CompactNashStage5.log \
            Literature/Sorin1986/CompactNashStage5.ok
          git commit -m 'Validate general compact Nash theorem' || exit 0
          git push origin HEAD:agent/promote-sorin1986
      - name: Fail if compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1
