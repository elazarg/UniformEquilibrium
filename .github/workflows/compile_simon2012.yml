name: Compile Simon 2012

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    if: github.head_ref == 'agent/promote-simon2012'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Compile literature dependency and promoted file
        run: |
          mkdir -p .lake/build/lib/lean/Literature
          lake env lean Literature/Simon2007.lean \
            -o .lake/build/lib/lean/Literature/Simon2007.olean
          lake env lean Literature/Simon2012.lean
