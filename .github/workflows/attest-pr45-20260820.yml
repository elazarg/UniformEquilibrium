name: Attest PR 45 remote verification

on:
  push:
    branches:
      - agent/complete-solan-vieille-2001
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: attest-pr45-remote-verification
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-solan-vieille-2001
          fetch-depth: 0

      - name: Require successful remote verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            -f branch=agent/complete-solan-vieille-2001 -f per_page=100 \
            --jq '[.workflow_runs[] | select(.name == "Verify PR 45 paper audit")][0].conclusion')
          test "$conclusion" = success
          body=$(gh api repos/${GITHUB_REPOSITORY}/pulls/45 --jq .body)
          case "$body" in
            '## Solan–Vieille 2001 paper audit'*) ;;
            *) echo "PR body has not been generated by the checked verifier"; exit 1 ;;
          esac
          test ! -e .github/workflows/finalize-pr45-20260820.yml
          test ! -e .github/workflows/verify-pr45-audit-20260820.yml
          test ! -e .github/workflows/export-pr45-source.yml

      - name: Post checked-head attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          existing=$(gh api repos/${GITHUB_REPOSITORY}/issues/45/comments --paginate \
            --jq '[.[] | select(.body | startswith("PR45-REMOTE-VERIFIED:"))] | length')
          if [ "$existing" = 0 ]; then
            gh pr comment 45 --body "PR45-REMOTE-VERIFIED: \`${sha}\`. The remote branch passed the dedicated production-frontier build, the complete \`Literature/SolanAndVieille2001.lean\` compile, and the audit-visibility ratchets recorded in the PR description."
          fi

      - name: Remove attestation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/attest-pr45-20260820.yml
          git add -A
          git commit -m "Remove temporary PR 45 attestation workflow"
          git push origin HEAD:agent/complete-solan-vieille-2001
