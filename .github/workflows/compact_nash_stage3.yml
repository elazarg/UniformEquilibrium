name: Compact Nash stage 3

on:
  push:
    branches: [agent/promote-sorin1986]
    paths:
      - .github/workflows/compact_nash_stage3.yml
      - Literature/Sorin1986/CompactNashStage2.ok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: agent/promote-sorin1986
      - name: Require stage 2
        run: test -f Literature/Sorin1986/CompactNashStage2.ok
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Append restricted-game bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Literature/Sorin1986/CompactNashScratch.lean')
          s = p.read_text()
          marker = '\nend CompactNash\n\nend Literature.Sorin1986\n'
          assert marker in s
          addition = r'''

          /-- Finite mixed payoff is the independent product expectation of
          pure payoff. -/
          theorem mixedPayoff_eq_productExpectation (H : FiniteStageGame)
              (profile : H.MixedProfile) (observer : H.Player) :
              H.mixedPayoff profile observer =
                productExpectation profile
                  (fun actions => H.payoff actions observer) := by
            classical
            simp [FiniteStageGame.mixedPayoff, FiniteStageGame.kernel,
              productExpectation, Math.Probability.expect_eq_sum,
              Math.PMFProduct.pmfPi_apply]

          /-- Reindexing a dependent profile commutes with a unilateral update. -/
          theorem piCongrLeft_update {P Q : Type*} [DecidableEq P]
              [DecidableEq Q] (S : Q → Type*) (e : P ≃ Q)
              (profile : ∀ i : P, S (e i)) (who : P) (strategy : S (e who)) :
              Equiv.piCongrLeft S e (Function.update profile who strategy) =
                Function.update (Equiv.piCongrLeft S e profile) (e who) strategy := by
            funext q
            obtain ⟨i, rfl⟩ := e.surjective q
            by_cases h : i = who
            · subst h
              simp [Equiv.piCongrLeft_apply_apply]
            · have he : e i ≠ e who := fun h' => h (e.injective h')
              simp [Equiv.piCongrLeft_apply_apply, Function.update_of_ne,
                h, he]

          /-- A deviation records its owner together with the owner's strategy. -/
          abbrev Deviation (G : CompactContinuousGame) :=
            Σ who, G.Strategy who

          /-- Finite action labels available to one reindexed player: a default
          action, and every listed deviation owned by that player. -/
          abbrev RestrictedAction (G : CompactContinuousGame)
              {n : ℕ} (e : Fin n ≃ G.Player) (F : Finset (Deviation G))
              (j : Fin n) :=
            Option {d : F // d.1.1 = e j}

          /-- Decode a finite label to the original compact strategy. -/
          noncomputable def restrictedStrategy (G : CompactContinuousGame)
              {n : ℕ} (e : Fin n ≃ G.Player) (F : Finset (Deviation G))
              (j : Fin n) : RestrictedAction G e F j → G.Strategy (e j)
            | none => Classical.choice
                (inferInstance : Nonempty (G.Strategy (e j)))
            | some d => by
                rcases d with ⟨⟨⟨who, strategy⟩, hmem⟩, howner⟩
                subst who
                exact strategy

          /-- The finite game obtained by retaining only a finite family of
          unilateral deviations, plus one default strategy per player. -/
          noncomputable def restrictedGame (G : CompactContinuousGame)
              {n : ℕ} (e : Fin n ≃ G.Player) (F : Finset (Deviation G)) :
              FiniteStageGame := by
            classical
            let eS : (∀ j : Fin n, G.Strategy (e j)) ≃
                (∀ i, G.Strategy i) := Equiv.piCongrLeft G.Strategy e
            exact {
              Player := Fin n
              Action := RestrictedAction G e F
              payoff := fun actions observer =>
                G.payoff (eS (fun j => restrictedStrategy G e F j (actions j)))
                  (e observer) }

          /-- Mixed payoff in the finite restriction is exactly payoff at the
          coordinatewise compact barycenters. -/
          theorem restricted_mixedPayoff_eq_realized
              (G : CompactContinuousGame) {n : ℕ}
              (e : Fin n ≃ G.Player) (F : Finset (Deviation G))
              (profile : (restrictedGame G e F).MixedProfile)
              (observer : Fin n) :
              (restrictedGame G e F).mixedPayoff profile observer =
                G.payoff
                  (Equiv.piCongrLeft G.Strategy e
                    (fun j => barycenter G (e j) (profile j)
                      (restrictedStrategy G e F j)))
                  (e observer) := by
            classical
            let eS : (∀ j : Fin n, G.Strategy (e j)) ≃
                (∀ i, G.Strategy i) := Equiv.piCongrLeft G.Strategy e
            have hmulti := multiAffine_barycenter n
              (S := fun j : Fin n => G.Strategy (e j))
              (A := fun j : Fin n => RestrictedAction G e F j)
              (mix := fun j => G.mix (e j))
              (fallback := fun j => Classical.choice
                (inferInstance : Nonempty (G.Strategy (e j))))
              (μ := profile)
              (point := fun j => restrictedStrategy G e F j)
              (F := fun p => G.payoff (eS p) (e observer))
              (by
                intro p j t x y ht0 ht1
                have h := G.payoffAffine (eS p) (e j) x y t
                  (e observer) ht0 ht1
                simpa [eS, piCongrLeft_update] using h)
            rw [mixedPayoff_eq_productExpectation]
            change productExpectation profile
                (fun actions =>
                  G.payoff (eS (fun j => restrictedStrategy G e F j (actions j)))
                    (e observer)) = _
            simpa [barycenter, eS] using hmulti.symm
          '''
          p.write_text(s.replace(marker, addition + marker))
          PY
      - name: Compile
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          lake build Literature.Sorin1986.CompactNashScratch 2>&1 | tee /tmp/compact-nash-stage3.log
      - name: Record result
        run: |
          cp /tmp/compact-nash-stage3.log Literature/Sorin1986/CompactNashStage3.log
          if [ "${{ steps.compile.outcome }}" = success ]; then
            printf 'success\n' > Literature/Sorin1986/CompactNashStage3.ok
          else
            rm -f Literature/Sorin1986/CompactNashStage3.ok
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Literature/Sorin1986/CompactNashScratch.lean \
            Literature/Sorin1986/CompactNashStage3.log \
            Literature/Sorin1986/CompactNashStage3.ok
          git commit -m 'Validate compact Nash finite restriction' || exit 0
          git push origin HEAD:agent/promote-sorin1986
      - name: Fail if compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1
