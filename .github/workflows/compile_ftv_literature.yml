name: Compile FTV literature

on:
  pull_request:
  push:
    branches: [agent/promote-ftv-1997]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-ftv-literature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - run: lake env lean Literature/FleschThuijsmanAndVrieze1997.lean
