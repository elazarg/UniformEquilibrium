name: Apply Simon 2012 fixes

on:
  push:
    branches: [agent/promote-simon2012]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-simon2012
          fetch-depth: 0
      - name: Apply current compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Literature/Simon2012.lean")
          text = path.read_text()

          def replace(old: str, new: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise RuntimeError(f"neither old nor new text found: {old[:80]!r}")

          replace(
          '''def Phi (G : QuittingGame) (M d : ℝ) : EZeroTilde G → Payoff G.Player :=
            fun z j =>
              QuittingOneStagePayoff G z.1.1 z.1.2 j -
                (5 * (Fintype.card G.Player : ℝ) * M / d) *
                  ((z.1.2 j : ℝ) /
                    (1 - (z.1.2 j : ℝ)) ^ Fintype.card G.Player) +
                M * ∑ k ∈ Finset.univ.erase j, (z.1.2 k : ℝ)
          ''',
          '''def Phi (G : QuittingGame) (M d : ℝ) : EZeroTilde G → Payoff G.Player := by
            classical
            exact fun z j =>
              QuittingOneStagePayoff G z.1.1 z.1.2 j -
                (5 * (Fintype.card G.Player : ℝ) * M / d) *
                  ((z.1.2 j : ℝ) /
                    (1 - (z.1.2 j : ℝ)) ^ Fintype.card G.Player) +
                M * ∑ k ∈ Finset.univ.erase j, (z.1.2 k : ℝ)
          ''')

          replace('(z : EZeroTilde G) (λ : UnitInterval)',
                  '(z : EZeroTilde G) (t : UnitInterval)')
          replace('(1 - (λ : ℝ)) • z.1.1 + (λ : ℝ) • a',
                  '(1 - (t : ℝ)) • z.1.1 + (t : ℝ) • a')
          replace('(λ : Payoff G.Player → UnitInterval)',
                  '(cutoff : Payoff G.Player → UnitInterval)')
          replace('Continuous λ ∧', 'Continuous cutoff ∧')
          replace('(λ x : ℝ)', '(cutoff x : ℝ)')
          replace('(λ a : ℝ)', '(cutoff a : ℝ)')
          replace('Section4X G inverse λ', 'Section4X G inverse cutoff')
          replace('Section4Y G inverse λ', 'Section4Y G inverse cutoff')
          replace('Section4H G inverse λ', 'Section4H G inverse cutoff')
          replace('IsSection4Cutoff G R δ λ', 'IsSection4Cutoff G R δ cutoff')
          replace('Section4J G inverse λ', 'Section4J G inverse cutoff')
          replace('def QuittingGame.withReward (G : QuittingGame)',
                  'def WithReward (G : QuittingGame)')
          replace('(G.withReward reward\')', '(WithReward G reward\')')

          replace(
          '''def HasNonsingularSingletonDifferences (G : QuittingGame) : Prop :=
            ∀ Q : Finset G.Player, 2 ≤ Q.card →
              (SingletonDifferenceMatrix G Q).det ≠ 0
          ''',
          '''def HasNonsingularSingletonDifferences (G : QuittingGame) : Prop := by
            classical
            exact ∀ Q : Finset G.Player, 2 ≤ Q.card →
              (SingletonDifferenceMatrix G Q).det ≠ 0
          ''')

          replace(
          '''def UpperGlueFiber (G : QuittingGame) (R ε δ : ℝ)
              (x : Payoff G.Player) : Set (Payoff G.Player) :=
            {y | ∃ p : QuitRow G,
              y = QuittingOneStagePayoff G x p ∧
                ∀ j, if x ∈ UpperNeighborhoodFor G R ε j
                  then (p j : ℝ) ≤ δ else (p j : ℝ) = 0}
          ''',
          '''def UpperGlueFiber (G : QuittingGame) (R ε δ : ℝ)
              (x : Payoff G.Player) : Set (Payoff G.Player) := by
            classical
            exact {y | ∃ p : QuitRow G,
              y = QuittingOneStagePayoff G x p ∧
                ∀ j, if x ∈ UpperNeighborhoodFor G R ε j
                  then (p j : ℝ) ≤ δ else (p j : ℝ) = 0}
          ''')

          replace(
          '''def GluedFiber (G : QuittingGame) (R ε δ : ℝ) :
              Correspondence (Payoff G.Player) (Payoff G.Player) :=
            fun x =>
              if x ∈ LowerNeighborhood G R ε then LowerGlueFiber G x
              else if x ∈ UpperNeighborhood G R ε then UpperGlueFiber G R ε δ x
              else ∅
          ''',
          '''def GluedFiber (G : QuittingGame) (R ε δ : ℝ) :
              Correspondence (Payoff G.Player) (Payoff G.Player) := by
            classical
            exact fun x =>
              if x ∈ LowerNeighborhood G R ε then LowerGlueFiber G x
              else if x ∈ UpperNeighborhood G R ε then UpperGlueFiber G R ε δ x
              else ∅
          ''')

          path.write_text(text)
          PY
          if git diff --quiet -- Literature/Simon2012.lean; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Literature/Simon2012.lean
          git commit -m "Fix Simon 2012 elaboration errors"
          git push origin HEAD:agent/promote-simon2012
