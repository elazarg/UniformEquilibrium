name: Apply Simon 2012 fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/promote-simon2012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-simon2012
          fetch-depth: 0
      - name: Apply fidelity refinements
        run: |
          python3 .github/simon2012_refine.py
          if git diff --quiet -- Literature/Simon2012.lean; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Literature/Simon2012.lean
          git commit -m "Refine Simon 2012 statement fidelity"
          git push origin HEAD:agent/promote-simon2012
