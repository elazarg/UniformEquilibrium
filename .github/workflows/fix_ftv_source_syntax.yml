name: Fix FTV source syntax

on:
  push:
    branches: [agent/promote-ftv-1997]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-ftv-source-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-ftv-1997
          fetch-depth: 0
      - name: Fix Theorem 3.2 comment and formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Literature/FleschThuijsmanAndVrieze1997.lean")
          text = path.read_text()
          text = text.replace(
              "/-! ### Theorem 3.2: stationary approximate equilibria\n\n",
              "/-! ### Theorem 3.2: stationary approximate equilibria -/\n\n",
          )
          text = text.replace(
              "      quittingTerminalPayoff GameTheory.FTVCyclicAdmissibleCycle.ftvReward\n(Function.update (paperStationaryBehaviorProfile profile) who deviation) who ≤",
              "      quittingTerminalPayoff GameTheory.FTVCyclicAdmissibleCycle.ftvReward\n          (Function.update (paperStationaryBehaviorProfile profile) who deviation) who ≤",
          )
          text = text.replace(
              "      -M ≤ quittingTerminalPayoff GameTheory.FTVCyclicAdmissibleCycle.ftvReward\n(paperStationaryBehaviorProfile profile) who := by",
              "      -M ≤ quittingTerminalPayoff GameTheory.FTVCyclicAdmissibleCycle.ftvReward\n          (paperStationaryBehaviorProfile profile) who := by",
          )
          path.write_text(text)
          PY
          if git diff --quiet -- Literature/FleschThuijsmanAndVrieze1997.lean; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Literature/FleschThuijsmanAndVrieze1997.lean
          git commit -m "Fix FTV Theorem 3.2 comment boundary"
          git push origin HEAD:agent/promote-ftv-1997
