name: Compact Nash master stage 5

on:
  push:
    branches: [agent/promote-sorin1986]
    paths:
      - .github/workflows/compact_nash_master_stage5.yml
      - Literature/Sorin1986/CompactNashMaster4.ok
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-nash-master-stage5
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: agent/promote-sorin1986
          fetch-depth: 0
      - name: Inspect state
        id: state
        run: |
          if test -f Literature/Sorin1986/CompactNashMaster5.ok; then echo done=yes >> "$GITHUB_OUTPUT"; else echo done=no >> "$GITHUB_OUTPUT"; fi
      - name: Wait for stage 4
        if: steps.state.outputs.done == 'no'
        run: |
          for attempt in $(seq 1 120); do
            git fetch origin agent/promote-sorin1986
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster.lean 2>/dev/null || true
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster4.ok 2>/dev/null || true
            test -f Literature/Sorin1986/CompactNashMaster4.ok && exit 0
            sleep 10
          done
          exit 1
      - uses: leanprover/lean-action@v1
        if: steps.state.outputs.done == 'no'
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Append compactness argument
        if: steps.state.outputs.done == 'no'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Literature/Sorin1986/CompactNashMaster.lean')
          s=p.read_text(); end=s.rindex('\nend CompactNash')
          addition=r'''

          /-- Updating one coordinate to a fixed strategy is continuous. -/
          theorem continuous_update_const (G : CompactContinuousGame)
              (who : G.Player) (strategy : G.Strategy who) :
              Continuous fun profile : (∀ i, G.Strategy i) =>
                Function.update profile who strategy := by
            apply continuous_pi
            intro i
            by_cases h : i = who
            · subst i
              simpa using (continuous_const :
                Continuous fun _ : (∀ i, G.Strategy i) => strategy)
            · simpa [Function.update_of_ne h] using
                (continuous_apply i :
                  Continuous fun profile : (∀ i, G.Strategy i) => profile i)

          /-- Profiles at which a fixed deviation is strictly profitable. -/
          def profitableSet (G : CompactContinuousGame) (d : Deviation G) :
              Set (∀ i, G.Strategy i) :=
            {profile | G.payoff profile d.1 <
              G.payoff (Function.update profile d.1 d.2) d.1}

          theorem isOpen_profitableSet (G : CompactContinuousGame)
              (d : Deviation G) : IsOpen (profitableSet G d) := by
            exact isOpen_lt (G.payoffContinuous d.1)
              ((G.payoffContinuous d.1).comp
                (continuous_update_const G d.1 d.2))

          /-- Compactness upgrades finite satisfiability of Nash inequalities
          to simultaneous satisfiability of all unilateral inequalities. -/
          theorem exists_all_nash_inequalities (G : CompactContinuousGame) :
              ∃ profile : ∀ i, G.Strategy i,
                ∀ d : Deviation G,
                  G.payoff (Function.update profile d.1 d.2) d.1 ≤
                    G.payoff profile d.1 := by
            classical
            by_contra hnone
            push_neg at hnone
            have hcover : (Set.univ : Set (∀ i, G.Strategy i)) ⊆
                ⋃ d : Deviation G, profitableSet G d := by
              intro profile _
              obtain ⟨d, hd⟩ := hnone profile
              exact Set.mem_iUnion.2 ⟨d, hd⟩
            obtain ⟨F, hF⟩ :=
              (isCompact_univ : IsCompact
                (Set.univ : Set (∀ i, G.Strategy i))).elim_finite_subcover
                (profitableSet G) (isOpen_profitableSet G) hcover
            obtain ⟨profile, hprofile⟩ := exists_satisfies_finset G F
            have hcovered := hF (Set.mem_univ profile)
            rcases Set.mem_iUnion.1 hcovered with ⟨d, hcovered⟩
            rcases Set.mem_iUnion.1 hcovered with ⟨hdF, hprofitable⟩
            exact (not_lt_of_ge (hprofile d hdF)) hprofitable

          /-- Every compact continuous game in the paper's interface has a
          Nash equilibrium. -/
          theorem exists_isNash (G : CompactContinuousGame) :
              ∃ profile : ∀ i, G.Strategy i, G.IsNash profile := by
            obtain ⟨profile, hprofile⟩ := exists_all_nash_inequalities G
            exact ⟨profile, fun who deviation => hprofile ⟨who, deviation⟩⟩

          /-- The compact game's Nash-profile set is closed. -/
          theorem isClosed_isNash (G : CompactContinuousGame) :
              IsClosed {profile : (∀ i, G.Strategy i) | G.IsNash profile} := by
            rw [show {profile : (∀ i, G.Strategy i) | G.IsNash profile} =
                ⋂ who, ⋂ deviation,
                  {profile | G.payoff
                      (Function.update profile who deviation) who ≤
                    G.payoff profile who} by
              ext profile
              simp [CompactContinuousGame.IsNash]]
            exact isClosed_iInter fun who => isClosed_iInter fun deviation =>
              isClosed_le
                ((G.payoffContinuous who).comp
                  (continuous_update_const G who deviation))
                (G.payoffContinuous who)

          /-- General compact Nash existence, together with compactness of the
          equilibrium-payoff set. -/
          theorem compact_nash_existence (G : CompactContinuousGame) :
              G.equilibriumPayoffs.Nonempty ∧ IsCompact G.equilibriumPayoffs := by
            constructor
            · obtain ⟨profile, hprofile⟩ := exists_isNash G
              exact ⟨G.payoff profile, ⟨profile, hprofile, rfl⟩⟩
            · have hprofiles :
                  IsCompact {profile : (∀ i, G.Strategy i) | G.IsNash profile} :=
                (isClosed_isNash G).isCompact
              have hpayoff : Continuous G.payoff :=
                continuous_pi G.payoffContinuous
              simpa [CompactContinuousGame.equilibriumPayoffs] using
                hprofiles.image_of_continuousOn hpayoff.continuousOn
          '''
          p.write_text(s[:end]+addition+s[end:])
          PY
          set -o pipefail
          lake env lean Literature/Sorin1986/CompactNashMaster.lean 2>&1 | tee Literature/Sorin1986/CompactNashMaster5.log
          printf 'success\n' > Literature/Sorin1986/CompactNashMaster5.ok
      - name: Commit compact Nash theorem
        if: steps.state.outputs.done == 'no'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Literature/Sorin1986/CompactNashMaster.lean Literature/Sorin1986/CompactNashMaster5.log Literature/Sorin1986/CompactNashMaster5.ok
          git commit -m 'Prove general compact Nash theorem'
          git pull --rebase origin agent/promote-sorin1986
          git push origin HEAD:agent/promote-sorin1986
