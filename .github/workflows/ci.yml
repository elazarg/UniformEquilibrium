name: Lean CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-ftv-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/promote-ftv-1997'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-ftv-1997
          fetch-depth: 0
          submodules: recursive
      - name: Apply review repair
        run: |
          if ! grep -q '^def paperMarkovization' Literature/FleschThuijsmanAndVrieze1997.lean; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/repair_ftv_codex_review.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line
                           for line in lines[start:end]) + '\n'
          Path('/tmp/repair_ftv.py').write_text(code)
          PY
            python3 /tmp/repair_ftv.py
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Literature/FleschThuijsmanAndVrieze1997.lean')
          text = path.read_text()

          start = text.index('/-! ### The pure stationary best-reply reduction')
          end = text.index('/-! ### Lemma 3.1: no stationary equilibrium -/', start)
          pure = '''/-! ### The pure stationary best-reply reduction

The paper uses the unconditional fact that against stationary opponents a pure
stationary best reply exists.  In this one-live-state game the two outcome-
relevant pure stationary alternatives are immediate Quit and Never quit.  The
paper claim is stated first, including that restriction in its type. -/

/-- The pure-stationary best-reply statement used immediately before Lemma 3.1. -/
def PaperPureStationaryBestReplyClaim : Prop :=
  ∀ (root : Player → PMF Bool) (who : Player),
    ∃ choice : Option ℕ,
      (choice = none ∨ choice = some 0) ∧
        ∀ deviation :
          (quittingGame GameTheory.FTVCyclicAdmissibleCycle.ftvReward).
            BehaviorStrategy who,
          quittingTerminalPayoff GameTheory.FTVCyclicAdmissibleCycle.ftvReward
              (Function.update
                (quittingStationaryProfile
                  GameTheory.FTVCyclicAdmissibleCycle.ftvReward root)
                who deviation) who ≤
            quittingTerminalPayoff GameTheory.FTVCyclicAdmissibleCycle.ftvReward
              (Function.update
                (quittingStationaryProfile
                  GameTheory.FTVCyclicAdmissibleCycle.ftvReward root)
                who
                (quittingPureTimeBehaviorStrategy
                  GameTheory.FTVCyclicAdmissibleCycle.ftvReward who choice)) who

/-! The full-rate stationary verifier proves attainment by one of the same two
outcome classes, but its exported witness is an unrestricted behavior strategy.
The remaining proof obligation here is the small witness-identification adapter
on the saturated opponent face. -/
theorem paper_pureStationaryBestReply :
    PaperPureStationaryBestReplyClaim := by
  sorry

/-- Under strict opponent contraction the selected Snell cap is attained by
literal `Never` or immediate Quit; the restriction is retained in the theorem
type rather than erased behind an unrestricted `Option ℕ` witness. -/
theorem stationary_bestReply_is_quitNow_or_never_of_contracting
    (root : Player → PMF Bool) (who : Player)
    (hcontracts :
      quittingStationaryFixedOpponentsContinueMass root who < 1) :
    ∃ choice : Option ℕ,
      (choice = none ∨ choice = some 0) ∧
        quittingTerminalPayoff GameTheory.FTVCyclicAdmissibleCycle.ftvReward
            (Function.update
              (quittingStationaryProfile
                GameTheory.FTVCyclicAdmissibleCycle.ftvReward root)
              who
              (quittingPureTimeBehaviorStrategy
                GameTheory.FTVCyclicAdmissibleCycle.ftvReward who choice)) who =
          quittingStationaryUnilateralCap
            GameTheory.FTVCyclicAdmissibleCycle.ftvReward root who := by
  let quitValue := quittingStationaryFixedOpponentsQuitValue
    GameTheory.FTVCyclicAdmissibleCycle.ftvReward root who
  let continueReward := quittingStationaryFixedOpponentsContinueReward
    GameTheory.FTVCyclicAdmissibleCycle.ftvReward root who
  let continueMass := quittingStationaryFixedOpponentsContinueMass root who
  by_cases hnever : quitValue ≤
      quittingStationaryNeverValue continueReward continueMass
  · refine ⟨none, Or.inl rfl, ?_⟩
    rw [quittingTerminalPayoff_update_pureTimeBehaviorStrategy,
      quittingProfileLiveRoot_stationary,
      quittingRootSequencePureTimeTerminalValue_const
        GameTheory.FTVCyclicAdmissibleCycle.ftvReward root who hcontracts]
    change quittingStationaryNeverValue continueReward continueMass =
      quittingStationarySelectedCap quitValue continueReward continueMass
    exact (max_eq_right hnever).symm
  · refine ⟨some 0, Or.inr rfl, ?_⟩
    rw [quittingTerminalPayoff_update_pureTimeBehaviorStrategy,
      quittingProfileLiveRoot_stationary,
      quittingRootSequencePureTimeTerminalValue_const
        GameTheory.FTVCyclicAdmissibleCycle.ftvReward root who hcontracts]
    change quittingStationaryPureTimeValue
        quitValue continueReward continueMass 0 =
      quittingStationarySelectedCap quitValue continueReward continueMass
    rw [quittingStationaryPureTimeValue]
    exact (max_eq_left (le_of_not_ge hnever)).symm

'''
          text = text[:start] + pure + text[end:]

          text = text.replace(
              '        (quittingGame reward).IsεAsymptoticNash\n(quittingTerminalPayoff reward) ε profile',
              '        (quittingGame reward).IsεAsymptoticNash\n          (quittingTerminalPayoff reward) ε profile',
          )
          path.write_text(text)
          PY
      - name: Commit materialized source repair
        run: |
          if git diff --quiet -- Literature/FleschThuijsmanAndVrieze1997.lean; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Literature/FleschThuijsmanAndVrieze1997.lean
          git commit -m "Fix FTV audit review layout"
          git push origin HEAD:agent/promote-ftv-1997
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Build imported dependencies
        run: |
          lake build \
            UniformEquilibrium.Quitting.Classification.PlayerReindex \
            UniformEquilibrium.Quitting.Examples.FTV.CyclicAdmissibleCycle \
            UniformEquilibrium.Quitting.Paths.InfinitePathCompiler \
            UniformEquilibrium.Quitting.Root.ApproximateFirstBranch \
            UniformEquilibrium.Quitting.Stationary.FullRateStationaryVerifier \
            UniformEquilibrium.Quitting.Terminal.TargetTail.TerminalUniformPayoffSelection
      - name: Compile FTV audit
        run: lake env lean Literature/FleschThuijsmanAndVrieze1997.lean

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - run: python3 scripts/check_docs.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_experiment_registry.py --execute
      - run: python3 scripts/check_import_graph.py
      - run: python3 scripts/check_proof_duplicates.py
      - run: python3 scripts/check_reward_bounds.py --check --max-nonnegative 0
      - run: python3 scripts/check_redundant_order_hypotheses.py --check
      - run: python3 scripts/check_derivable_telescope_hypotheses.py --check
      - run: python3 scripts/check_trust.py
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - run: lake build
