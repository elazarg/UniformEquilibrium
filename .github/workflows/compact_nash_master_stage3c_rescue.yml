name: Compact Nash master stage 3c rescue

on:
  push:
    branches: [agent/promote-sorin1986]
    paths:
      - .github/workflows/compact_nash_master_stage3c_rescue.yml
      - Literature/Sorin1986/CompactNashMaster3b.ok
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-nash-master-stage3c-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: agent/promote-sorin1986
          fetch-depth: 0
      - name: Inspect state
        id: state
        run: |
          if test -f Literature/Sorin1986/CompactNashMaster3c.ok; then echo done=yes >> "$GITHUB_OUTPUT"; else echo done=no >> "$GITHUB_OUTPUT"; fi
      - name: Wait for stage 3b
        if: steps.state.outputs.done == 'no'
        run: |
          for attempt in $(seq 1 120); do
            git fetch origin agent/promote-sorin1986
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster.lean 2>/dev/null || true
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster3b.ok 2>/dev/null || true
            git checkout origin/agent/promote-sorin1986 -- Literature/Sorin1986/CompactNashMaster3c.ok 2>/dev/null || true
            test -f Literature/Sorin1986/CompactNashMaster3c.ok && exit 0
            test -f Literature/Sorin1986/CompactNashMaster3b.ok && exit 0
            sleep 10
          done
          exit 1
      - uses: leanprover/lean-action@v1
        if: steps.state.outputs.done == 'no'
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Search proof variants
        if: steps.state.outputs.done == 'no'
        run: |
          if test -f Literature/Sorin1986/CompactNashMaster3c.ok; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Literature/Sorin1986/CompactNashMaster.lean'); s=p.read_text()
          candidates=[s.find('/-- The finite restriction\'s mixed payoff'),s.find('theorem restricted_mixedPayoff_eq_realized')]
          cuts=[x for x in candidates if x>=0]
          cut=min(cuts) if cuts else s.rindex('\nend CompactNash')
          Path('/tmp/master3c-core').write_text(s[:cut].rstrip()+'\n\n')
          PY
          cat > /tmp/master3c-statement <<'LEAN'
          theorem restricted_mixedPayoff_eq_realized
              (G : CompactContinuousGame) {n : ℕ}
              (e : Fin n ≃ G.Player) (F : Finset (Deviation G))
              (profile : (restrictedGame G e F).MixedProfile)
              (observer : Fin n) :
              (restrictedGame G e F).mixedPayoff profile observer =
                G.payoff
                  (Equiv.piCongrLeft G.Strategy e
                    (fun j => barycenter G (e j) (profile j)
                      (restrictedStrategy G e F j)))
                  (e observer) := by
            classical
            let eS : (∀ j : Fin n, G.Strategy (e j)) ≃
                (∀ i, G.Strategy i) := Equiv.piCongrLeft G.Strategy e
            have hmulti := multiAffine_barycenter n
              (S := fun j : Fin n => G.Strategy (e j))
              (A := fun j : Fin n => RestrictedAction G e F j)
              (mix := fun j => G.mix (e j))
              (fallback := fun j => Classical.choice
                (inferInstance : Nonempty (G.Strategy (e j))))
              (μ := profile)
              (point := fun j => restrictedStrategy G e F j)
              (F := fun p => G.payoff (eS p) (e observer))
              (by
                intro p j t x y ht0 ht1
                have h := G.payoffAffine (eS p) (e j) x y t
                  (e observer) ht0 ht1
                simpa [eS, piCongrLeft_update] using h)
          LEAN
          cat > /tmp/master3c-tail <<'LEAN'

          end CompactNash

          end Literature.Sorin1986
          LEAN
          mkdir -p /tmp/master3c-bodies
          cat > /tmp/master3c-bodies/1 <<'LEAN'
            rw [mixedPayoff_eq_productExpectation]
            change productExpectation profile
                (fun actions =>
                  G.payoff (eS (fun j => restrictedStrategy G e F j (actions j)))
                    (e observer)) = _
            simpa [barycenter, eS] using hmulti.symm
          LEAN
          cat > /tmp/master3c-bodies/2 <<'LEAN'
            rw [mixedPayoff_eq_productExpectation
              (restrictedGame G e F) profile observer]
            change productExpectation profile
                (fun actions =>
                  G.payoff (eS (fun j => restrictedStrategy G e F j (actions j)))
                    (e observer)) = _
            simpa [barycenter, eS] using hmulti.symm
          LEAN
          cat > /tmp/master3c-bodies/3 <<'LEAN'
            have hmixed := mixedPayoff_eq_productExpectation
              (restrictedGame G e F) profile observer
            rw [hmixed]
            change productExpectation profile
                (fun actions =>
                  G.payoff (eS (fun j => restrictedStrategy G e F j (actions j)))
                    (e observer)) = _
            simpa only [barycenter, eS] using hmulti.symm
          LEAN
          cat > /tmp/master3c-bodies/4 <<'LEAN'
            rw [mixedPayoff_eq_productExpectation]
            change productExpectation profile
                (fun actions =>
                  G.payoff (eS (fun j => restrictedStrategy G e F j (actions j)))
                    (e observer)) =
              G.payoff
                (eS (fun j => weightedPoint (G.mix (e j))
                  (Classical.choice (inferInstance : Nonempty (G.Strategy (e j))))
                  (probabilityEntries (profile j) (restrictedStrategy G e F j))))
                (e observer)
            exact hmulti.symm
          LEAN
          cat > /tmp/master3c-bodies/5 <<'LEAN'
            rw [mixedPayoff_eq_productExpectation]
            simpa [restrictedGame, barycenter, eS] using hmulti.symm
          LEAN
          : > Literature/Sorin1986/CompactNashMaster3cRescue.log
          success=''
          for body in /tmp/master3c-bodies/*; do
            variant=$(basename "$body")
            echo "===== VARIANT $variant =====" >> Literature/Sorin1986/CompactNashMaster3cRescue.log
            cat /tmp/master3c-core /tmp/master3c-statement "$body" /tmp/master3c-tail > Literature/Sorin1986/CompactNashMaster.lean
            if lake env lean Literature/Sorin1986/CompactNashMaster.lean >> Literature/Sorin1986/CompactNashMaster3cRescue.log 2>&1; then success="$variant"; break; fi
          done
          test -n "$success"
          printf 'success variant %s\n' "$success" > Literature/Sorin1986/CompactNashMaster3c.ok
      - name: Commit rescue proof
        if: steps.state.outputs.done == 'no'
        run: |
          if test ! -f Literature/Sorin1986/CompactNashMaster3c.ok; then exit 1; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Literature/Sorin1986/CompactNashMaster.lean Literature/Sorin1986/CompactNashMaster3cRescue.log Literature/Sorin1986/CompactNashMaster3c.ok
          git commit -m 'Find robust finite restriction realization proof'
          git pull --rebase origin agent/promote-sorin1986
          git push origin HEAD:agent/promote-sorin1986
