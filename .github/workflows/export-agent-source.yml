name: Agent Lean environment

on:
  push:
    branches:
      - agent/complete-solan-vieille-2001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-sv2001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Split reusable Lean environment
        run: |
          tar --zstd -cf - -C "$HOME" .elan -C "$GITHUB_WORKSPACE" .lake GameTheory/.lake \
            | split -b 400M -d -a 2 - "$GITHUB_WORKSPACE/agent-lean-environment.part-"
          ls -lh "$GITHUB_WORKSPACE"/agent-lean-environment.part-*
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-00
          path: agent-lean-environment.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-01
          path: agent-lean-environment.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-02
          path: agent-lean-environment.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-03
          path: agent-lean-environment.part-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-04
          path: agent-lean-environment.part-04
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-05
          path: agent-lean-environment.part-05
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-06
          path: agent-lean-environment.part-06
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-07
          path: agent-lean-environment.part-07
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment-08
          path: agent-lean-environment.part-08
          compression-level: 0
          retention-days: 1
      - name: Build production dependencies
        run: lake build UniformEquilibrium
      - name: Compile the literature file
        run: lake env lean Literature/SolanAndVieille2001.lean
