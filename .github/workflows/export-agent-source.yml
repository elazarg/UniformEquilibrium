name: Export agent source

on:
  push:
    branches:
      - agent/complete-solan-vieille-2001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/uniform-equilibrium-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: uniform-equilibrium-source
          path: /tmp/uniform-equilibrium-source.tgz
          retention-days: 1
