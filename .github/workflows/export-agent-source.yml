name: Agent Lean environment

on:
  push:
    branches:
      - agent/complete-solan-vieille-2001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-sv2001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Archive reusable Lean environment
        run: >-
          tar --zstd -cf /tmp/agent-lean-environment.tar.zst
          -C "$HOME" .elan
          -C "$GITHUB_WORKSPACE" .lake GameTheory/.lake
      - uses: actions/upload-artifact@v4
        with:
          name: agent-lean-environment
          path: /tmp/agent-lean-environment.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Build production dependencies
        run: lake build UniformEquilibrium
      - name: Compile the literature file
        run: lake env lean Literature/SolanAndVieille2001.lean
