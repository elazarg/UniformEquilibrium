name: Apply PR 45 actual content

on:
  push:
    branches:
      - agent/complete-solan-vieille-2001
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr45-actual-content
  cancel-in-progress: true

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply staged formalization patch
        shell: bash
        run: |
          cat .pr45-upload/part* | base64 --decode > /tmp/pr45-actual-content.patch
          echo "301ca12086a680ab69ff553ace6aab05502e697eec84468da2443a8b52fe69a0  /tmp/pr45-actual-content.patch" | sha256sum --check -
          git apply --check /tmp/pr45-actual-content.patch
          git apply /tmp/pr45-actual-content.patch
          rm -rf .pr45-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Solan-Vieille 2001 formalization work"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build production dependencies
        run: lake build UniformEquilibrium

      - name: Compile the literature file
        run: lake env lean Literature/SolanAndVieille2001.lean
