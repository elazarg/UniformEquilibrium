name: Lean feedback and exact source

on:
  pull_request:
    paths:
      - "**/*.lean"
      - ".gitmodules"
      - "GameTheory"
      - "lake-manifest.json"
      - "lakefile.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - "scripts/ci_changed_lean_targets.py"
      - "scripts/test_ci_changed_lean_targets.py"
      - "scripts/check_trust.py"
      - ".github/workflows/lean-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused Lean
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build changed Lean targets
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode="$(python3 scripts/ci_changed_lean_targets.py --mode "$BASE_SHA" "$HEAD_SHA")"
          case "$mode" in
            none)
              echo "No Lean source changed."
              ;;
            focused)
              mapfile -t targets < <(
                python3 scripts/ci_changed_lean_targets.py --targets "$BASE_SHA" "$HEAD_SHA"
              )
              printf 'Building changed Lean targets:\n  %s\n' "${targets[@]}"

              focused_lakefile="$RUNNER_TEMP/lakefile.focused.lean"
              cp lakefile.lean "$focused_lakefile"
              cat >> "$focused_lakefile" <<'EOF'

          lean_lib Literature where
            srcDir := "."
            leanOptions := uniformEquilibriumLeanOptions
          EOF
              lake --dir "$GITHUB_WORKSPACE" --file "$focused_lakefile" \
                build "${targets[@]}"
              ;;
            full)
              echo "Structural Lean change; running the full build."
              lake build
              ;;
            *)
              echo "Unknown build mode: $mode" >&2
              exit 2
              ;;
          esac

      - name: Full build for a manual run
        if: github.event_name == 'workflow_dispatch'
        run: lake build

      - name: Trust scan
        run: python3 scripts/check_trust.py

  source:
    name: Exact source artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Package exact source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/exact-source"
          mkdir -p "$out"

          actual_source_sha="$(git rev-parse HEAD)"
          test "$actual_source_sha" = "$SOURCE_SHA"
          game_theory_sha="$(git -C GameTheory rev-parse HEAD)"
          lake_manifest_sha="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          lean_toolchain="$(tr -d '\r\n' < lean-toolchain)"

          cat > "$out/manifest.txt" <<EOF
          format_version=1
          mode=directory
          repository=$GITHUB_REPOSITORY
          source_sha=$actual_source_sha
          requested_source_sha=$SOURCE_SHA
          base_sha=$BASE_SHA
          game_theory_sha=$game_theory_sha
          lean_toolchain=$lean_toolchain
          lake_manifest_sha256=$lake_manifest_sha
          EOF

          tar --zstd -cf "$out/source.tar.zst" \
            --exclude='./.git' \
            --exclude='./GameTheory/.git' \
            --exclude='./.lake' \
            --exclude='./GameTheory/.lake' \
            .
          (cd "$out" && sha256sum source.tar.zst > source.tar.zst.sha256)

          cat > "$out/README.txt" <<'EOF'
          This is an exact source directory snapshot without Git metadata.

          Extract it into a fresh directory with:

            tar --no-same-owner --zstd -xpf source.tar.zst -C DESTINATION

          Verify source.tar.zst.sha256 and manifest.txt before use.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/exact-source
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  environment:
    name: Local Lean environment chunks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Package compatible environment
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/local-lean-environment"
          mkdir -p "$out"
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          toolchain_path="$(dirname "$(dirname "$(elan which lean)")")"
          tar --zstd -cf "$out/lake-cache.tar.zst" .lake
          split -b 400M -d -a 2 \
            "$out/lake-cache.tar.zst" "$out/lake-cache.part-"
          rm "$out/lake-cache.tar.zst"
          tar --zstd -cf "$out/lean-toolchain.tar.zst" \
            -C "$(dirname "$toolchain_path")" "$(basename "$toolchain_path")"
          split -b 400M -d -a 2 \
            "$out/lean-toolchain.tar.zst" "$out/lean-toolchain.part-"
          rm "$out/lean-toolchain.tar.zst"
          sha256sum "$out"/lake-cache.part-* \
            "$out"/lean-toolchain.part-* > "$out/SHA256SUMS"
          cat > "$out/manifest.txt" <<EOF_MANIFEST
          source_sha=$(git rev-parse HEAD)
          game_theory_sha=$(git -C GameTheory rev-parse HEAD)
          lean_toolchain=$toolchain
          toolchain_dir=$(basename "$toolchain_path")
          lake_manifest_sha256=$(sha256sum lake-manifest.json | cut -d' ' -f1)
          EOF_MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-manifest-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/local-lean-environment/manifest.txt
            ${{ runner.temp }}/local-lean-environment/SHA256SUMS
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-toolchain-00-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lean-toolchain.part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-toolchain-01-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lean-toolchain.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-00-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-01-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-02-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-03-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-04-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-04
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-05-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-05
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-06-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-06
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: local-lean-cache-07-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/local-lean-environment/lake-cache.part-07
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
