name: Lean feedback and exact source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused Lean
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build changed Lean targets
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode="$(python3 scripts/ci_changed_lean_targets.py --mode "$BASE_SHA" "$HEAD_SHA")"
          case "$mode" in
            none)
              echo "No Lean source changed."
              ;;
            focused)
              mapfile -t targets < <(
                python3 scripts/ci_changed_lean_targets.py --targets "$BASE_SHA" "$HEAD_SHA"
              )
              printf 'Building changed Lean targets:\n  %s\n' "${targets[@]}"
              lake build "${targets[@]}"
              ;;
            full)
              echo "Structural Lean change; running the full build."
              lake build
              ;;
            *)
              echo "Unknown build mode: $mode" >&2
              exit 2
              ;;
          esac

      - name: Full build for a manual run
        if: github.event_name == 'workflow_dispatch'
        run: lake build

      - name: Trust scan
        run: python3 scripts/check_trust.py

  source:
    name: Exact source artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Package exact source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/exact-source"
          mkdir -p "$out"

          actual_source_sha="$(git rev-parse HEAD)"
          test "$actual_source_sha" = "$SOURCE_SHA"
          game_theory_sha="$(git -C GameTheory rev-parse HEAD)"
          lake_manifest_sha="$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          lean_toolchain="$(tr -d '\r\n' < lean-toolchain)"

          cat > "$out/manifest.txt" <<EOF
          format_version=1
          mode=directory
          repository=$GITHUB_REPOSITORY
          source_sha=$actual_source_sha
          requested_source_sha=$SOURCE_SHA
          base_sha=$BASE_SHA
          game_theory_sha=$game_theory_sha
          lean_toolchain=$lean_toolchain
          lake_manifest_sha256=$lake_manifest_sha
          EOF

          tar --zstd -cf "$out/source.tar.zst" \
            --exclude='./.git' \
            --exclude='./GameTheory/.git' \
            --exclude='./.lake' \
            --exclude='./GameTheory/.lake' \
            .
          sha256sum "$out/source.tar.zst" > "$out/source.tar.zst.sha256"

          cat > "$out/README.txt" <<'EOF'
          This is an exact source directory snapshot without Git metadata.

          Extract it into a fresh directory with:

            tar --no-same-owner --zstd -xpf source.tar.zst -C DESTINATION

          Verify source.tar.zst.sha256 and manifest.txt before use.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/exact-source
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
