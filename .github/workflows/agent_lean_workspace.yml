name: Agent Lean workspace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Measure Lean workspace
        run: |
          {
            du -sh "$HOME/.elan" || true
            du -sh "$HOME/.elan"/* || true
            du -sh .lake || true
            du -sh .lake/build || true
            du -sh .lake/packages/* || true
            du -sh .lake/packages/*/.lake/build || true
            find "$HOME/.elan" .lake -type f -printf '%s %p\n' | sort -nr | head -100
          } > /tmp/workspace-sizes.txt
          cat /tmp/workspace-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-sizes
          retention-days: 1
          path: /tmp/workspace-sizes.txt
