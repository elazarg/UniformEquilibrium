name: Agent Lean workspace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Split cached Lean environment
        run: |
          tar -cf - -C "$HOME" .elan -C "$GITHUB_WORKSPACE" .lake \
            | zstd -3 -T0 \
            | split -d -a 2 -b 300M - /tmp/lean-env.tar.zst.part-
      - uses: actions/upload-artifact@v4
        with:
          name: lean-env-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: /tmp/lean-env.tar.zst.part-00
      - uses: actions/upload-artifact@v4
        with:
          name: lean-env-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
          path: /tmp/lean-env.tar.zst.part-01
      - uses: actions/upload-artifact@v4
        with:
          name: lean-env-02
          retention-days: 1
