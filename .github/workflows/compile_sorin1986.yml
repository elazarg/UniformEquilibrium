name: Compile Sorin1986

on:
  pull_request:
    paths:
      - Literature/Sorin1986.lean
      - Literature/Sorin1986CompactScratch.lean
      - Literature/Sorin1986CompactPayoffScratch.lean
      - .github/workflows/compile_sorin1986.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-sorin1986-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build imported modules
        run: |
          lake build \
            UniformEquilibrium.ProofView.Concepts.Stochastic.Transform.Repeated.RealizedActionRepeatedAdapter \
            UniformEquilibrium.ProofView.Concepts.Welfare.FolkTheorem.Feasible

      - name: Compile Sorin1986
        run: |
          lake env lean -o /tmp/Sorin1986.olean Literature/Sorin1986.lean
          lake env bash -lc 'export LEAN_PATH="/tmp:$LEAN_PATH"; lean -o /tmp/Sorin1986CompactScratch.olean Literature/Sorin1986CompactScratch.lean'
          lake env bash -lc 'export LEAN_PATH="/tmp:$LEAN_PATH"; lean Literature/Sorin1986CompactPayoffScratch.lean'
