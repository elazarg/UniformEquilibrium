name: Compile Sorin1986

on:
  push:
    branches: [agent/promote-sorin1986]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-sorin1986-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build imported modules
        run: |
          lake build \
            UniformEquilibrium.ProofView.Concepts.Stochastic.Transform.Repeated.RealizedActionRepeatedAdapter \
            UniformEquilibrium.ProofView.Concepts.Welfare.FolkTheorem.Feasible

      - name: Compile Sorin1986
        run: lake env lean Literature/Sorin1986.lean
