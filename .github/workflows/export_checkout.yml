name: Export checkout

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/promote-simon2012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Package checkout
        run: |
          tar --exclude=.git --exclude='.lake/build' -czf /tmp/uniform-equilibrium-checkout.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: uniform-equilibrium-checkout
          path: /tmp/uniform-equilibrium-checkout.tar.gz
          retention-days: 1
