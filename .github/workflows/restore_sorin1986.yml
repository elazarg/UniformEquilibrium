name: Restore Sorin1986 compact Nash source

on:
  push:
    branches:
      - agent/promote-sorin1986
    paths:
      - .github/workflows/restore_sorin1986.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-sorin1986
          fetch-depth: 0
          persist-credentials: true

      - name: Restore and patch the paper source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/agent/promote-sorin1986-pre-nash-backup:refs/remotes/origin/agent/promote-sorin1986-pre-nash-backup
          mkdir -p Literature/future
          git show origin/agent/promote-sorin1986-pre-nash-backup:Literature/Sorin1986.lean \
            > Literature/Sorin1986.lean
          git show origin/agent/promote-sorin1986-pre-nash-backup:Literature/future/Sorin1986AsymptoticProperties.lean \
            > Literature/future/Sorin1986AsymptoticProperties.lean
          rm -f Literature/future/Sorin1986.lean
          python3 scripts/_restore_sorin1986.py
          python3 scripts/generate_axiom_audit.py

      - name: Commit the clean restored tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore_sorin1986.yml scripts/_restore_sorin1986.py
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Restore Sorin audit with compact Nash existence"
          git push origin HEAD:agent/promote-sorin1986
